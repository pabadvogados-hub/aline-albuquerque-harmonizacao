# Exemplo de bloco nginx (NAO foi aplicado em lugar nenhum).
# A Meta so entrega webhook em HTTPS com certificado valido (ex.: certbot --nginx -d atendimento.SEUDOMINIO).
server {
    listen 443 ssl http2;
    server_name atendimento.SEUDOMINIO.com.br;

    ssl_certificate     /etc/letsencrypt/live/atendimento.SEUDOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atendimento.SEUDOMINIO.com.br/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name atendimento.SEUDOMINIO.com.br;
    return 301 https://$host$request_uri;
}
