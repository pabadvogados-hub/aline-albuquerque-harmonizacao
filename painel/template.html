<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Aline Albuquerque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#100c0b; --bg2:#171110; --card:#1d1614; --card2:#261d1a; --linha:#3a2c27;
  --txt:#f6ece6; --txt2:#cdb8ae; --txt3:#947d73;
  --principal:#d9a596; --secundaria:#b87a6a; --fenix:#e8603c;
  --bom:#86b896; --ruim:#e5776b; --aviso:#e3b35e;
  --sombra:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px rgba(0,0,0,.28);
  --raio:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 500px at 85% -10%, color-mix(in srgb,var(--principal) 13%,transparent), transparent 60%),
             radial-gradient(700px 420px at -10% 30%, color-mix(in srgb,var(--fenix) 7%,transparent), transparent 60%)}
a{color:var(--principal)}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12px}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px 60px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 75%,transparent);padding:16px 0 10px}
.topo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:13px;margin-right:auto;min-width:0}
.mono{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--principal);letter-spacing:.5px;
  background:var(--card);border:1px solid color-mix(in srgb,var(--principal) 55%,transparent)}
.mono::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid color-mix(in srgb,var(--fenix) 35%,transparent)}
.marca h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;margin:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{color:var(--txt3);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.abas{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto}
.abas button{background:none;border:0;color:var(--txt2);font:600 12.5px Manrope;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.abas button.on{background:linear-gradient(135deg,var(--principal),var(--secundaria));color:#1a100d}
.btn-ic{background:var(--card);border:1px solid var(--linha);color:var(--txt2);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.nav a{color:var(--txt2);text-decoration:none;font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--linha);border-radius:20px;white-space:nowrap;background:var(--card)}
.nav a:hover{color:var(--principal);border-color:var(--principal)}
.gerado{color:var(--txt3);font-size:12px;margin-top:8px}
.demo{background:repeating-linear-gradient(135deg,var(--card2) 0 12px,var(--card) 12px 24px);border:1px dashed var(--aviso);
  color:var(--aviso);padding:10px 14px;border-radius:12px;font-weight:600;margin:6px 0 4px;font-size:13px}
.sec{margin-top:34px;scroll-margin-top:150px}
.sec>h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec>h2 svg{color:var(--principal)}
.sec>h2 .sub{font:500 12px Manrope;color:var(--txt3);margin-left:auto}
.sec>p.expl{color:var(--txt3);margin:0 0 14px;font-size:13px;max-width:900px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px;box-shadow:var(--sombra);min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--txt2);letter-spacing:.02em}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .rot{color:var(--txt3);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.kpi .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 4px}
.kpi.destaque{background:linear-gradient(160deg,color-mix(in srgb,var(--principal) 16%,var(--card)),var(--card) 70%);border-color:color-mix(in srgb,var(--principal) 40%,var(--linha))}
.det{font-size:12px;color:var(--txt2)}
.var{font-size:12px;font-weight:800}
.var.up{color:var(--bom)} .var.down{color:var(--ruim)} .var.neu{color:var(--txt3)}
.barra{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--secundaria),var(--principal));border-radius:4px}
.duas{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.meio{grid-template-columns:repeat(2,minmax(0,1fr))}
.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.graf{position:relative;height:290px}
.graf.peq{height:210px}
.graf.alto{height:340px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--txt3);font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
th.ord{cursor:pointer} th.ord:hover{color:var(--principal)}
td{padding:10px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabela{overflow-x:auto}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--txt2)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.st.ACTIVE i{background:var(--bom)} .st.PAUSED i,.st.CAMPAIGN_PAUSED i,.st.ADSET_PAUSED i{background:var(--aviso)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--card2);color:var(--txt2);white-space:nowrap}
.tag.ok{color:var(--bom);background:color-mix(in srgb,var(--bom) 14%,transparent)}
.tag.mau{color:var(--ruim);background:color-mix(in srgb,var(--ruim) 14%,transparent)}
.tag.mid{color:var(--aviso);background:color-mix(in srgb,var(--aviso) 14%,transparent)}
.tag.fx{color:var(--fenix);background:color-mix(in srgb,var(--fenix) 14%,transparent)}
.hbar{display:grid;grid-template-columns:118px 1fr 100px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--secundaria),var(--principal));border-radius:5px}
.hbar .t i.fx{background:linear-gradient(90deg,var(--principal),var(--fenix))}
.hbar>span:last-child{text-align:right;color:var(--txt2);font-variant-numeric:tabular-nums}
/* saude */
.saude{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
.anel{position:relative;width:190px;height:190px;margin:auto}
.anel svg{transform:rotate(-90deg)}
.anel .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anel .num b{font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1}
.anel .num small{display:block;color:var(--txt3);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.itens-saude{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
/* recomendacoes */
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--linha);border-left:3px solid var(--txt3)}
.rec.critico{border-left-color:var(--ruim)} .rec.atencao{border-left-color:var(--aviso)} .rec.bom{border-left-color:var(--bom)} .rec.info{border-left-color:var(--principal)}
.rec .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2)}
.rec.critico .ico{color:var(--ruim)} .rec.atencao .ico{color:var(--aviso)} .rec.bom .ico{color:var(--bom)} .rec.info .ico{color:var(--principal)}
.rec b{display:block;font-size:14px;margin-bottom:2px}
.rec p{margin:0;color:var(--txt2);font-size:13px}
.rec .cmd{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copiar{background:var(--card2);border:1px solid var(--linha);color:var(--txt2);font:600 11.5px Manrope;padding:5px 10px;border-radius:8px;cursor:pointer}
.copiar:hover{color:var(--principal);border-color:var(--principal)}
/* funil */
.funil{display:grid;gap:7px}
.etapa{display:grid;grid-template-columns:170px 1fr 130px;gap:12px;align-items:center}
.etapa .faixa{height:38px;border-radius:10px;display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:15px;color:#1a100d;
  background:linear-gradient(90deg,var(--principal),color-mix(in srgb,var(--principal) 60%,var(--fenix)));min-width:64px;font-variant-numeric:tabular-nums}
.etapa .faixa.proj{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--principal) 35%,transparent) 0 8px,transparent 8px 16px);color:var(--txt);border:1px dashed var(--principal)}
.etapa .nome{font-weight:600;font-size:13px}
.etapa .nome small{display:block;color:var(--txt3);font-weight:500;font-size:11.5px}
.etapa .taxa{text-align:right;font-size:12px;color:var(--txt2)}
/* video campeao */
.campeao{display:grid;grid-template-columns:300px 1fr;gap:20px}
.tela{aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--bg2));position:relative;display:grid;place-items:center;color:var(--txt3);border:1px solid var(--linha)}
.tela img,.tela video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tela .selo{position:absolute;top:12px;left:12px;z-index:2;background:linear-gradient(135deg,var(--principal),var(--fenix));color:#1a100d;font-weight:800;font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.06em}
.mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.met{background:var(--card2);border-radius:12px;padding:12px}
.met span{display:block;color:var(--txt3);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.met strong{font-size:20px;font-variant-numeric:tabular-nums}
.met em{display:block;font-style:normal;font-size:11px;margin-top:2px}
.curvinha{display:flex;align-items:flex-end;gap:3px;height:34px}
.curvinha i{flex:1;background:linear-gradient(var(--principal),var(--secundaria));border-radius:3px 3px 0 0;min-height:2px}
.mini-th{width:46px;height:64px;border-radius:8px;overflow:hidden;background:var(--card2);flex:none;display:grid;place-items:center;color:var(--txt3)}
.mini-th img{width:100%;height:100%;object-fit:cover}
.cel-nome{display:flex;gap:10px;align-items:center;min-width:240px}
.cel-nome b{display:block;font-size:13px;line-height:1.3}
.cel-nome small{color:var(--txt3);font-size:11px}
.medidor{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.medidor .t{width:60px;height:6px;background:var(--card2);border-radius:4px;overflow:hidden}
.medidor .t i{display:block;height:100%}
/* anuncios */
.ads{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ad{padding:0;overflow:hidden;display:flex;flex-direction:column}
.ad .img{aspect-ratio:4/5;background:linear-gradient(135deg,var(--card2),var(--bg2));display:grid;place-items:center;color:var(--txt3);position:relative}
.ad .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad .corpo{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ad b{font-size:13.5px;line-height:1.3}
.ad small{color:var(--txt3);font-size:11.5px}
.ad .copy{color:var(--txt2);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ad .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:8px;font-size:11px;color:var(--txt3)}
.ad .nums strong{display:block;color:var(--txt);font-size:15px}
.rank{position:absolute;top:10px;left:10px;z-index:2;background:linear-gradient(135deg,var(--principal),var(--fenix));color:#1a100d;font-weight:800;font-size:11px;padding:3px 9px;border-radius:20px}
.tipo{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.rk{display:flex;gap:4px;flex-wrap:wrap}
/* instagram */
.perfil{display:flex;align-items:center;gap:14px}
.perfil .foto{width:64px;height:64px;border-radius:50%;background:var(--card2);overflow:hidden;flex:none;padding:3px;background:linear-gradient(135deg,var(--fenix),var(--principal))}
.perfil .foto div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card2);border:2px solid var(--card)}
.perfil .foto img{width:100%;height:100%;object-fit:cover}
.perfil b{font-size:16px} .perfil small{color:var(--txt3)}
.bio{color:var(--txt2);font-size:12.5px;margin:12px 0 0;white-space:pre-line}
.mini{grid-template-columns:repeat(4,1fr);margin-top:16px}
.mini div{background:var(--card2);border-radius:12px;padding:10px 12px}
.mini span{display:block;color:var(--txt3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mini strong{font-size:18px}
.posts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.post{padding:0;overflow:hidden;text-decoration:none;color:inherit}
.post .img{aspect-ratio:4/5;background:linear-gradient(160deg,var(--card2),var(--bg2));position:relative;display:flex;align-items:flex-end;padding:12px;color:var(--txt2);font-size:12px}
.post .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .fmt{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;z-index:1}
.post .corpo{padding:10px 12px;font-size:11.5px;color:var(--txt2)}
.post .corpo strong{color:var(--txt);font-size:15px}
.ordbar{display:flex;gap:6px;align-items:center;margin:16px 0 10px;flex-wrap:wrap}
.ordbar button{border:1px solid var(--linha);background:var(--card);color:var(--txt2);font:600 11.5px Manrope;padding:5px 11px;border-radius:20px;cursor:pointer}
.ordbar button.on{color:#1a100d;background:var(--principal);border-color:var(--principal)}
select{background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:9px;padding:6px 10px;font:600 12.5px Manrope;max-width:100%}
.erro{color:var(--txt2);border:1px dashed var(--linha);border-radius:14px;padding:18px;background:var(--card)}
.erro b{color:var(--aviso)}
.wpp{color:var(--bom);text-decoration:none;font-weight:700}
.glos{grid-template-columns:repeat(3,minmax(0,1fr))}
.glos div b{color:var(--principal);display:block;margin-bottom:2px}
.glos div{font-size:12.5px;color:var(--txt2)}
footer{margin-top:44px;color:var(--txt3);font-size:12px;text-align:center}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.duas,.tres,.meio,.glos{grid-template-columns:1fr}
  .campeao{grid-template-columns:1fr}.campeao .tela{max-width:300px;margin:auto;width:100%}.mets{grid-template-columns:repeat(2,1fr)}
  .saude{grid-template-columns:1fr}.itens-saude{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 16px 40px}.kpi .val{font-size:27px}.marca h1{font-size:21px}
  .abas{width:100%}.mini{grid-template-columns:repeat(2,1fr)}.hbar{grid-template-columns:88px 1fr 78px}
  .etapa{grid-template-columns:110px 1fr 84px}.rec{grid-template-columns:auto 1fr}.rec .acao{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topo">
      <div class="marca">
        <div class="mono" id="mono">AA</div>
        <div style="min-width:0"><h1 id="nome"></h1><small id="assin">Painel de marketing</small></div>
      </div>
      <div class="abas" id="abas"></div>
      <button class="btn-ic" id="tema" title="Tema claro ou escuro" aria-label="Tema claro ou escuro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <div class="gerado" id="gerado"></div>
  <div id="app"></div>
  <footer>Dados da Meta (Facebook e Instagram) e da central de atendimento. Conversa = pessoa que iniciou conversa pelo anuncio (WhatsApp ou Direct) ou preencheu formulario.<br>Comparativos com o mercado: docs/ESTUDO_DE_MERCADO.md. Atualize com <code>atualizar_painel.bat</code>.</footer>
</div>

<script>
const D = /*__DADOS__*/null;

const IC = {
  alerta:'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  ok:'<path d="M20 6 9 17l-5-5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  anuncio:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  grafico:'<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>',
  pessoas:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  insta:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  lista:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  imagem:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4V8z"/>',
  funil:'<path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/>',
  relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  coracao:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  alvo:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>',
  livro:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  fogo:'<path d="M12 22c4 0 7-2.7 7-7 0-3.2-2-5.8-3.5-7.5-.4 2-1.6 3.3-3 3.8.4-3.3-1-6.5-3.5-8.3C9 6.5 5 9.5 5 15c0 4.3 3 7 7 7z"/>',
  escudo:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
};
const ic = (n, s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

const brl = v => v==null ? '-' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0 = v => v==null ? '-' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const int = v => v==null ? '-' : Math.round(v).toLocaleString('pt-BR');
const pct = (v,d=1) => v==null ? '-' : v.toLocaleString('pt-BR',{maximumFractionDigits:d})+'%';
const dec = (v,d=1) => v==null ? '-' : v.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataBR = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';
const soma = (l, f) => l.reduce((s,x)=>s+(f(x)||0),0);
const BM = () => D.benchmarks || {};

function variacao(a, b, menorMelhor=false){
  if (a==null || !b) return '<span class="var neu">sem comparativo</span>';
  const v = (a-b)/b*100, bom = menorMelhor ? v<0 : v>0;
  const cls = Math.abs(v)<1 ? 'neu' : (bom?'up':'down');
  return `<span class="var ${cls}">${v>0?'+':''}${v.toFixed(0)}%</span> <span class="det">vs. periodo anterior</span>`;
}
// classifica um valor contra o benchmark: ok | mid | mau
function classe(valor, chave){
  const r = BM()[chave]; if (valor==null || !r) return '';
  if (r.menor_melhor) return valor<=r.bom ? 'ok' : valor>=r.ruim ? 'mau' : 'mid';
  return valor>=r.bom ? 'ok' : valor<=r.ruim ? 'mau' : 'mid';
}
const COR = {ok:'var(--bom)', mid:'var(--aviso)', mau:'var(--ruim)', '':'var(--txt3)'};
const selo = (valor, chave, fmt) => { const c = classe(valor, chave); return `<span class="tag ${c}">${fmt(valor)}</span>`; };
function medidor(valor, chave, fmt, maximo){
  const c = classe(valor, chave);
  return `<div class="medidor"><span>${fmt(valor)}</span><div class="t"><i style="width:${valor==null?0:Math.min(100,valor/maximo*100)}%;background:${COR[c]}"></i></div></div>`;
}

function kpis(P){
  const a = P.anuncios, c = P.comercial || {}, i = P.instagram, out = [];
  if (!a.ok) return erroBloco('Anuncios', a);
  const t = a.total, an = a.anterior, alvo = D.metas?.cpl_alvo;
  const orc = D.metas?.orcamento_mensal;
  out.push(`<div class="card kpi"><div class="rot">Investido</div><div class="val">${brl(t.gasto)}</div>${variacao(t.gasto, an.gasto)}
    ${orc && periodo==='mes' ? `<div class="barra"><i style="width:${Math.min(100,t.gasto/orc*100)}%"></i></div><div class="det">${Math.round(t.gasto/orc*100)}% do orcamento de ${brl0(orc)}</div>`:''}</div>`);
  out.push(`<div class="card kpi"><div class="rot">Conversas pelo anuncio</div><div class="val">${int(t.leads.total)}</div>${variacao(t.leads.total, an.leads.total)}
    <div class="det">${int(t.leads.conversas)} WhatsApp/Direct · ${int(t.leads.formularios)} formulario</div></div>`);
  out.push(`<div class="card kpi"><div class="rot">Custo por conversa</div><div class="val">${brl(t.cpl)}</div>${variacao(t.cpl, an.cpl, true)}
    <div class="det">${alvo?`Meta ${brl(alvo)} · `:''}Mercado ${brl0(BM().custo_conversa?.bom)} a ${brl0(BM().custo_conversa?.ruim)} ${selo(t.cpl,'custo_conversa',x=>classe(x,'custo_conversa')==='ok'?'otimo':classe(x,'custo_conversa')==='mau'?'caro':'na media')}</div></div>`);
  const profPct = t.leads.conversas ? t.leads.conversas_profundas/t.leads.conversas*100 : null;
  out.push(`<div class="card kpi"><div class="rot">Conversas reais</div><div class="val">${int(t.leads.conversas_profundas)}</div>
    <div class="det">${pct(profPct,0)} mandaram 2+ mensagens · ${brl(t.custo_conversa_profunda)} cada</div>
    <div class="barra"><i style="width:${Math.min(100,profPct||0)}%"></i></div></div>`);
  if (c.tem_atendimento){
    out.push(`<div class="card kpi"><div class="rot">Avaliacoes agendadas</div><div class="val">${int(c.agendados)}</div>
      <div class="det">${pct(c.taxas?.conversa_agendamento,0)} das conversas · ${brl(c.custo_agendamento)} cada</div></div>`);
    out.push(`<div class="card kpi"><div class="rot">Pacientes fechados</div><div class="val">${int(c.fecharam)}</div>
      <div class="det">${brl(c.custo_paciente)} de anuncio por paciente · ticket ${brl0(c.ticket_medio)}</div></div>`);
    out.push(`<div class="card kpi destaque"><div class="rot">Faturamento atribuido</div><div class="val">${brl0(c.faturamento)}</div>
      <div class="det">Lucro sobre anuncio ${brl0(c.lucro_bruto)}</div></div>`);
    out.push(`<div class="card kpi destaque"><div class="rot">Retorno (ROAS)</div><div class="val">${c.roas?dec(c.roas)+'x':'-'}</div>
      <div class="det">cada R$ 1 investido voltou ${c.roas?brl(c.roas):'-'} ${selo(c.roas,'roas',()=>classe(c.roas,'roas')==='ok'?'excelente':classe(c.roas,'roas')==='mau'?'baixo':'bom')}</div></div>`);
  } else {
    const pj = c.projecao || {};
    out.push(`<div class="card kpi"><div class="rot">Alcance</div><div class="val">${int(t.alcance)}</div>${variacao(t.alcance, an.alcance)}<div class="det">${int(t.impressoes)} impressoes · freq. ${dec(t.frequencia)}</div></div>`);
    out.push(`<div class="card kpi"><div class="rot">CTR de link</div><div class="val">${pct(t.ctr_link,2)}</div><div class="det">${int(t.cliques)} cliques · CPM ${brl(t.cpm)}</div></div>`);
    out.push(`<div class="card kpi destaque"><div class="rot">Projecao de pacientes</div><div class="val">${int(pj.fecharam)}</div><div class="det">pelas taxas medias do mercado (ligue a central para o numero real)</div></div>`);
    out.push(`<div class="card kpi destaque"><div class="rot">Faturamento projetado</div><div class="val">${brl0(pj.faturamento)}</div><div class="det">ROAS projetado ${pj.roas?dec(pj.roas)+'x':'-'}</div></div>`);
  }
  return `<div class="grid kpis">${out.join('')}</div>`;
}

function blocoFunil(P){
  const a = P.anuncios, c = P.comercial || {}; if (!a.ok) return '';
  const t = a.total, pj = c.projecao;
  const linhas = [
    ['Impressoes','vezes que o anuncio apareceu', t.impressoes, null],
    ['Cliques no anuncio','foram para o WhatsApp/Direct', t.cliques, t.impressoes ? t.cliques/t.impressoes*100 : null, 'ctr_link'],
    ['Conversas iniciadas','mandaram a 1a mensagem', t.leads.total, t.cliques ? t.leads.total/t.cliques*100 : null],
    ['Conversas reais','2+ mensagens', t.leads.conversas_profundas, t.leads.conversas ? t.leads.conversas_profundas/t.leads.conversas*100 : null, 'conversa_profunda'],
  ];
  let proj = false;
  if (c.tem_atendimento){
    linhas.push(['Qualificadas','pelo robo ou pela equipe', c.qualificados, c.conversas ? c.qualificados/c.conversas*100 : null]);
    linhas.push(['Avaliacao agendada','', c.agendados, c.taxas?.conversa_agendamento, 'conversa_agendamento']);
    linhas.push(['Compareceu','', c.compareceram, c.taxas?.comparecimento, 'comparecimento']);
    linhas.push(['Fechou tratamento', brl0(c.faturamento), c.fecharam, c.taxas?.fechamento, 'fechamento']);
  } else if (pj){
    proj = true;
    linhas.push(['Avaliacao agendada','projecao pelo mercado', pj.agendados, BM().conversa_agendamento?.bom, null, true]);
    linhas.push(['Compareceu','projecao', pj.compareceram, BM().comparecimento?.bom, null, true]);
    linhas.push(['Fechou','projecao: '+brl0(pj.faturamento), pj.fecharam, BM().fechamento?.bom, null, true]);
  }
  const base = Math.log10(Math.max(t.impressoes,10));
  const html = linhas.map(([n, s, v, tx, bm, pr]) => {
    const w = v ? Math.max(8, Math.log10(Math.max(v,1))/base*100) : 4;
    const cl = bm ? classe(tx, bm) : '';
    return `<div class="etapa"><div class="nome">${n}<small>${esc(s||'')}</small></div><div><div class="faixa ${pr?'proj':''}" style="width:${w}%">${int(v)}</div></div>
      <div class="taxa">${tx!=null?`<span class="tag ${cl}">${pct(tx)}</span>`:''}${bm&&BM()[bm]?`<br><small style="color:var(--txt3)">mercado ${BM()[bm].menor_melhor?'ate':'acima de'} ${BM()[bm].bom}%</small>`:''}</div></div>`;
  }).join('');
  return secao('funil','funil','Funil completo: do anuncio ao paciente', proj ? 'parte tracejada = projecao' : '',
    'Mostra onde o paciente se perde. Anuncio bom com pouca avaliacao = gargalo no atendimento. Muita avaliacao e pouco fechamento = gargalo na consulta.',
    `<div class="grid duas"><div class="card"><div class="funil">${html}</div></div>
     <div class="card"><h3>Quanto custa cada etapa</h3>
       ${[['Conversa',t.cpl],['Conversa real',t.custo_conversa_profunda],['Avaliacao agendada',c.custo_agendamento],['Paciente fechado',c.custo_paciente]].map(([n,v])=>`<div class="hbar" style="grid-template-columns:1fr auto"><span>${n}</span><span style="font-size:15px;color:var(--txt);font-weight:700">${brl(v)}</span></div>`).join('')}
       <div class="mini grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
         <div><span>Ticket medio</span><strong>${brl0(c.ticket_medio || BM().ticket_medio)}</strong></div>
         <div><span>Tempo 1a resposta</span><strong>${P.atendimento?.ok && P.atendimento.tempo_primeira_resposta_min!=null ? dec(P.atendimento.tempo_primeira_resposta_min)+' min':'-'}</strong></div></div>
       <p class="det" style="margin-top:12px">Regra de saude: anuncio por paciente abaixo de ${BM().custo_paciente_max_pct_ticket||30}% do ticket.${c.custo_paciente&&c.ticket_medio?` Hoje: <b>${pct(c.custo_paciente/c.ticket_medio*100,0)}</b>.`:''}</p></div></div>`);
}

  const cid = p.cidades.slice(0,8).map(x => `<div class="hbar"><span>${esc(x.chave.split(',')[0])}</span><div class="t"><i style="width:${x.valor/mx*100}%"></i></div><span>${int(x.valor)}</span></div>`).join('');
  const totI = soma(p.idade,x=>x.valor)||1, mxI = Math.max(...p.idade.map(x=>x.valor),1);
  const ida = p.idade.map(x => `<div class="hbar"><span>${esc(x.chave)}</span><div class="t"><i style="width:${x.valor/mxI*100}%"></i></div><span>${pct(x.valor/totI*100,0)}</span></div>`).join('');
  const totG = soma(p.genero,x=>x.valor)||1, g = k => (p.genero.find(x=>x.chave===k)?.valor||0)/totG*100;
  const local = p.cidades.filter(x => /Santos|Vicente|Guaruj|Praia Grande|Cubat|Bertioga|Mongagu|Itanha|Peru/i.test(x.chave));
  return secao('seguidores','pessoas','Quem segue o perfil', '', `${pct(soma(local,x=>x.valor)/tot*100,0)} dos seguidores (das cidades listadas) estao na Baixada Santista: publico que pode virar paciente.`,
    `<div class="grid tres"><div class="card"><h3>Cidades</h3>${cid}</div>
      <div class="card"><h3>Idade</h3>${ida}<div class="mini grid" style="grid-template-columns:1fr 1fr"><div><span>Mulheres</span><strong>${pct(g('F'),0)}</strong></div><div><span>Homens</span><strong>${pct(g('M'),0)}</strong></div></div></div>
      <div class="card"><h3>Horario em que os seguidores estao online</h3>${p.online?.length?'<div class="graf peq"><canvas id="gOnline"></canvas></div><p class="det">Poste 30 a 60 min antes do pico.</p>':'<p class="det">A Meta nao devolveu esse dado.</p>'}</div></div>`);
}

function blocoLeads(){
  const L = D.leads_formulario;
  if (!L || !L.ok || !L.leads.length) return '';
  const campo = (c, ...nomes) => { for (const n of nomes){ const k = Object.keys(c).find(x => x.toLowerCase().includes(n)); if (k) return c[k]; } return ''; };
  const linhas = L.leads.map(l => {
    const nome = campo(l.campos,'full_name','nome','name'), tel = campo(l.campos,'phone','telefone','whats');
    const extra = Object.entries(l.campos).filter(([k]) => !/name|nome|phone|telefone|whats|email/i.test(k)).map(([,v])=>v).join(' · ');
    const num = tel.replace(/\D/g,'');
    return `<tr><td>${esc(l.data.slice(8,10)+'/'+l.data.slice(5,7)+' '+l.data.slice(11,16))}</td><td><b>${esc(nome)}</b></td>
      <td>${num?`<a class="wpp" href="https://wa.me/${num}" target="_blank" rel="noopener">${esc(tel)}</a>`:'-'}</td><td>${esc(extra)}</td><td><small>${esc(l.anuncio||l.campanha||'')}</small></td></tr>`;}).join('');
  return secao('formularios','lista','Leads de formulario', L.formularios.map(f => `${esc(f.nome)} (${int(f.total)})`).join(' · '), '',
    `<div class="card tabela"><table><thead><tr><th>Quando</th><th>Nome</th><th>WhatsApp</th><th>Interesse</th><th>Anuncio</th></tr></thead><tbody>${linhas}</tbody></table></div>`);
}

// ---------------------------------------------------------------- mercado / glossario
function blocoMercado(P){
  const a = P.anuncios, c = P.comercial || {}; if (!a.ok) return '';
  const t = a.total, v = t.video || {};
  const itens = [
    ['custo_conversa', t.cpl, brl], ['ctr_link', t.ctr_link, x=>pct(x,2)], ['cpm', t.cpm, brl], ['frequencia_max', t.frequencia, x=>dec(x)],
    ['gancho', v.gancho, x=>pct(x,0)], ['retencao', v.retencao, x=>pct(x,0)],
    ['conversa_profunda', t.leads.conversas ? t.leads.conversas_profundas/t.leads.conversas*100 : null, x=>pct(x,0)],
    ['conversa_agendamento', c.taxas?.conversa_agendamento, x=>pct(x,0)], ['comparecimento', c.taxas?.comparecimento, x=>pct(x,0)],
    ['fechamento', c.taxas?.fechamento, x=>pct(x,0)], ['roas', c.roas, x=>x==null?'-':dec(x)+'x'],
  ];
  const lin = itens.map(([k, val, f]) => { const r = BM()[k]; if (!r) return ''; const cl = classe(val,k);
    return `<tr><td><b>${esc(r.rotulo)}</b><br><small style="color:var(--txt3)">${esc(r.fonte||'')}</small></td><td class="n"><b>${f(val)}</b></td>
      <td class="n">${r.menor_melhor?'ate ':''}${f(r.bom)}${r.menor_melhor?'':'+'}</td><td class="n">${r.menor_melhor?'acima de ':'abaixo de '}${f(r.ruim)}</td>
      <td class="n">${val==null?'<span class="det">sem dado</span>':`<span class="tag ${cl}">${cl==='ok'?'nivel das melhores':cl==='mau'?'abaixo do mercado':'na media'}</span>`}</td></tr>`; }).join('');
  return secao('mercado','escudo','Aline x mercado', 'harmonizacao / estetica · Meta Ads · 2026',
    'Faixas tiradas do estudo de mercado (clinicas e agencias que publicam numeros). Verde = no nivel das melhores; amarelo = na media; vermelho = pede acao.',
    `<div class="card tabela"><table><thead><tr><th>Metrica</th><th class="n">Aline</th><th class="n">Otimo</th><th class="n">Ruim</th><th class="n">Situacao</th></tr></thead><tbody>${lin}</tbody></table></div>`);
}
function blocoGlossario(){
  const g = [['Conversa','Pessoa que clicou no anuncio e mandou mensagem no WhatsApp ou Direct.'],['Conversa real','Conversa em que a pessoa mandou 2 ou mais mensagens. Separa curioso de interessado.'],
    ['CTR de link','De cada 100 pessoas que viram o anuncio, quantas clicaram.'],['CPM','Quanto custa aparecer 1.000 vezes. Sobe quando o publico e disputado.'],
    ['Frequencia','Quantas vezes, em media, a mesma pessoa viu o anuncio. Acima de 3,5 o anuncio cansa.'],['Gancho','% de quem viu o video e assistiu pelo menos 3 segundos. Mede o inicio.'],
    ['Retencao','Dos que passaram dos 3 segundos, quantos assistiram ate o fim (ThruPlay). Mede o meio.'],['ThruPlay','Video assistido ate o fim ou por 15 segundos.'],
    ['Qualidade (Meta)','Nota que a Meta da ao anuncio comparado a concorrentes do mesmo publico.'],['Aprendizado','A Meta precisa de umas 50 conversas por semana no conjunto para otimizar bem. "Limitado" = falta volume.'],
    ['ROAS','Faturamento dividido pelo que foi investido em anuncio. 8x = cada R$ 1 voltou R$ 8.'],['Custo por paciente','Investimento em anuncio dividido pelos pacientes que fecharam.']];
  return secao('glossario','livro','Glossario','', '', `<div class="card"><div class="grid glos">${g.map(([t,d])=>`<div><b>${t}</b>${d}</div>`).join('')}</div></div>`);
}

// ---------------------------------------------------------------- graficos
function graficos_(P){
  graficos.forEach(g => g.destroy()); graficos = [];
  if (!window.Chart) return;
  const c = cores();
  Chart.defaults.color = c.txt3; Chart.defaults.font.family = 'Manrope'; Chart.defaults.borderColor = c.linha;
  const leg = {position:'bottom', labels:{boxWidth:10, usePointStyle:true}};
  const add = (id, cfg) => { const el = document.getElementById(id); if (el) graficos.push(new Chart(el, cfg)); };
  const a = P.anuncios;
  if (a.ok){
    const lbl = a.diario.map(d=>dataBR(d.data));
    add('gDia', {data:{labels:lbl, datasets:[
      {type:'bar', label:'Investido (R$)', data:a.diario.map(d=>d.gasto), backgroundColor:c.s+'99', borderRadius:4, yAxisID:'y'},
      {type:'line', label:'Conversas', data:a.diario.map(d=>d.leads.total), borderColor:c.p, backgroundColor:c.p, tension:.35, pointRadius:2, yAxisID:'y1'},
      {type:'line', label:'Conversas reais', data:a.diario.map(d=>d.leads.conversas_profundas), borderColor:c.f, backgroundColor:c.f, borderDash:[4,3], tension:.35, pointRadius:0, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend:leg},
        scales:{y:{beginAtZero:true, grid:{color:c.linha}, ticks:{callback:v=>'R$ '+v}}, y1:{position:'right', beginAtZero:true, grid:{display:false}}, x:{grid:{display:false}}}}});
    const alvo = D.metas?.cpl_alvo;
    add('gCpl', {type:'line', data:{labels:lbl, datasets:[
      {label:'Custo por conversa', data:a.diario.map(d=>d.cpl), borderColor:c.p, backgroundColor:c.p+'22', fill:true, tension:.35, pointRadius:2, spanGaps:true},
      ...(alvo?[{label:'Meta', data:lbl.map(()=>alvo), borderColor:c.bom, borderDash:[6,4], pointRadius:0}]:[])]},
      options:{maintainAspectRatio:false, plugins:{legend:leg, tooltip:{callbacks:{label:x=>' '+brl(x.raw)}}}, scales:{y:{beginAtZero:true, grid:{color:c.linha}, ticks:{callback:v=>'R$ '+v}}, x:{grid:{display:false}}}}});
    // curva de retencao: campeao x 2 seguintes x mercado
    const v = (a.videos||[]).filter(x=>x.video);
    if (v.length){
      const camp = escolherCampeao(v), outros = [...v].filter(x=>x!==camp).sort((x,y)=>(x.cpl??9e9)-(y.cpl??9e9)).slice(0,2);
      const pts = ['p25','p50','p75','p95','p100'], cs = [c.f, c.s, c.txt3];
      add('gCurva', {type:'line', data:{labels:['25%','50%','75%','95%','100%'], datasets:[camp,...outros].map((x,k)=>({label:(k===0?'Campeao: ':'')+x.nome.slice(0,38), data:pts.map(p=>x.video.curva[p]), borderColor:cs[k], backgroundColor:cs[k], tension:.3, pointRadius:3, borderWidth:k===0?3:1.5}))},
        options:{maintainAspectRatio:false, plugins:{legend:leg, tooltip:{callbacks:{label:x=>' '+x.raw+'%'}}}, scales:{y:{beginAtZero:true, max:100, grid:{color:c.linha}, ticks:{callback:v=>v+'%'}}, x:{grid:{display:false}}}}});
    }
    const sel = document.getElementById('selFadiga');
    const desenhaFadiga = k => { const f = a.fadiga[k]; const el = document.getElementById('gFadiga'); if (!f||!el) return;
      const old = graficos.find(g => g.canvas===el); if (old){ old.destroy(); graficos = graficos.filter(g=>g!==old); }
      graficos.push(new Chart(el, {data:{labels:f.dias.map(d=>dataBR(d.data)), datasets:[
        {type:'line', label:'Frequencia acumulada', data:f.dias.map(d=>d.frequencia), borderColor:c.f, backgroundColor:c.f, tension:.3, pointRadius:1, yAxisID:'y'},
        {type:'line', label:'CTR de link (%)', data:f.dias.map(d=>d.ctr_link), borderColor:c.p, backgroundColor:c.p, tension:.3, pointRadius:1, yAxisID:'y1'},
        {type:'bar', label:'Conversas', data:f.dias.map(d=>d.leads), backgroundColor:c.s+'66', borderRadius:3, yAxisID:'y2'}]},
        options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend:leg},
          scales:{y:{beginAtZero:true, grid:{color:c.linha}, title:{display:true,text:'frequencia'}}, y1:{position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>v+'%'}}, y2:{display:false, beginAtZero:true}, x:{grid:{display:false}}}}})); };
    if (sel){ sel.onchange = () => desenhaFadiga(+sel.value); desenhaFadiga(0); }
    const h = a.publico.horas||[];
    add('gHora', {data:{labels:h.map(x=>String(x.hora).padStart(2,'0')+'h'), datasets:[
      {type:'bar', label:'Conversas', data:h.map(x=>x.leads), backgroundColor:h.map(x=>x.cpl && a.total.cpl && x.cpl<=a.total.cpl*0.85 ? c.f+'cc' : c.p+'99'), borderRadius:3, yAxisID:'y'},
      {type:'line', label:'Custo por conversa', data:h.map(x=>x.cpl), borderColor:c.txt3, pointRadius:0, tension:.35, spanGaps:true, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend:leg},
        scales:{y:{beginAtZero:true, grid:{color:c.linha}}, y1:{position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>'R$ '+v}}, x:{grid:{display:false}}}}});
    const s = a.publico.semana||[];
    add('gSemana', {data:{labels:s.map(x=>x.dia), datasets:[
      {type:'bar', label:'Conversas', data:s.map(x=>x.leads), backgroundColor:c.p+'aa', borderRadius:4, yAxisID:'y'},
      {type:'line', label:'Custo/conversa', data:s.map(x=>x.cpl), borderColor:c.f, pointRadius:3, tension:.3, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, plugins:{legend:leg}, scales:{y:{beginAtZero:true, grid:{color:c.linha}}, y1:{position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>'R$ '+v}}, x:{grid:{display:false}}}}});
    const fx = {}; a.publico.idade_genero.forEach(l => { const f = fx[l.idade] = fx[l.idade]||{leads:0,gasto:0}; f.leads += l.leads; f.gasto += l.gasto; });
    const ks = Object.keys(fx).sort();
    add('gIdade', {data:{labels:ks, datasets:[
      {type:'bar', label:'Conversas', data:ks.map(k=>fx[k].leads), backgroundColor:c.p+'aa', borderRadius:4, yAxisID:'y'},
      {type:'line', label:'Custo/conversa', data:ks.map(k=>fx[k].leads?fx[k].gasto/fx[k].leads:null), borderColor:c.f, pointRadius:3, tension:.3, yAxisID:'y1'}]},
      options:{maintainAspectRatio:false, plugins:{legend:leg}, scales:{y:{beginAtZero:true, grid:{color:c.linha}}, y1:{position:'right', beginAtZero:true, grid:{display:false}, ticks:{callback:v=>'R$ '+Math.round(v)}}, x:{grid:{display:false}}}}});
  }
  const at = P.atendimento;
  if (at?.ok) add('gAtend', {type:'bar', data:{labels:at.diario.map(d=>dataBR(d.data)), datasets:[{label:'Novos', data:at.diario.map(d=>d.novos), backgroundColor:c.p+'bb', borderRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:c.linha}, beginAtZero:true}}}});
  const i = P.instagram;
  if (i.ok && i.seguidores_dia.length) add('gSeg', {type:'bar', data:{labels:i.seguidores_dia.map(d=>dataBR(d.data)), datasets:[{label:'Novos seguidores', data:i.seguidores_dia.map(d=>d.novos), backgroundColor:c.p+'bb', borderRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:c.linha}, beginAtZero:true}}}});
  const pi = D.publico_instagram;
  if (pi?.ok && pi.online?.length) add('gOnline', {type:'line', data:{labels:pi.online.map(x=>String(x.hora).padStart(2,'0')+'h'), datasets:[{label:'Seguidores online', data:pi.online.map(x=>x.seguidores), borderColor:c.p, backgroundColor:c.p+'33', fill:true, tension:.35, pointRadius:0}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}, ticks:{maxTicksLimit:8}}, y:{grid:{color:c.linha}, beginAtZero:true}}}});
}

// ---------------------------------------------------------------- render
function render(){
  if (!D){ document.getElementById('app').innerHTML = '<div class="erro">Painel sem dados. Rode atualizar_painel.bat.</div>'; return; }
  aplicarMarca();
  document.getElementById('nome').textContent = D.clinica;
  document.getElementById('gerado').textContent = 'Atualizado em ' + D.gerado_em;
  abas(); nav();
  const P = D.periodos[periodo] || Object.values(D.periodos)[0];
  const y = window.scrollY;
  document.getElementById('app').innerHTML =
    (D.demo ? '<div class="demo">DEMONSTRACAO: numeros ficticios, dentro das faixas reais do nicho. O painel mostra os dados reais da Aline assim que a Meta liberar o acesso.</div>' : '') +
    `<section class="sec" id="resumo" style="margin-top:14px">${kpis(P)}${blocoSaude(P)}</section>` +
    blocoRecs(P) + blocoFunil(P) + blocoEvolucao(P) + blocoVideos(P) + blocoFadiga(P) + blocoAnuncios(P) + blocoCampanhas(P) +
    blocoHorarios(P) + blocoPublico(P) + blocoAtendimento(P) + blocoInstagram(P) + blocoPublicoIG() + blocoLeads() + blocoMercado(P) + blocoGlossario();
  graficos_(P);
  window.scrollTo(0, y);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ord],[data-ordads],[data-ordposts],.copiar'); if (!t) return;
  if (t.dataset.ord){ const [tab, c] = t.dataset.ord.split('|'); const o = ordem[tab]; ordem[tab] = [c, o[0]===c ? -o[1] : -1]; render(); }
  else if (t.dataset.ordads){ ordemAds = t.dataset.ordads; render(); }
  else if (t.dataset.ordposts){ ordemPosts = t.dataset.ordposts; render(); }
  else if (t.classList.contains('copiar')){ try { navigator.clipboard.writeText(t.dataset.c); t.textContent = 'Copiado'; } catch(err) {} }
});
render();
</script>
